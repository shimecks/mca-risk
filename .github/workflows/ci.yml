name: ci

on:
  push:
    branches: [main]
    tags: ["part-*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --locked

      # Includes the app smoke tests (tests/test_app.py, AppTest on every page) against the committed
      # snapshot app/data/, and the full-pipeline time-budget test (tests/test_pipeline.py).
      - name: Lint and test
        run: make lint test

      - name: Full pipeline from a clean build/ (budget 2 minutes, no network)
        run: make clean all
        timeout-minutes: 5

      - name: Evals E1-E9 (every gate must pass)
        run: make eval

      - name: App smoke tests on a snapshot rebuilt from this run
        run: |
          make app-data
          uv run pytest tests/test_app.py -q

      - name: Upload build manifest and eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-artifacts
          path: |
            build/run_manifest.json
            build/report.md
            evals/reports/latest.*
          if-no-files-found: warn
