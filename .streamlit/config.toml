# Streamlit config (repo root, read by `make app` and by Streamlit Community Cloud).
[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"

[theme]
# Calm, high-contrast light theme. Blue is the "cash view" accent used in every chart.
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f2"
textColor = "#1f1f1d"
font = "sans-serif"
